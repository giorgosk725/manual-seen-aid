name: Deploy (Cloudflare Pages)

# Publicación desde GitHub, SOLO a mano (V54-04): el circuito efectivo hoy es el local
# (`npm run publicar`, tras la orden «publica»; docs/EDICION_EDITORIAL.md). Este flujo queda
# preparado para cuando se configure el secreto CLOUDFLARE_API_TOKEN (permiso «Cloudflare
# Pages: Edit»); sin él, avisa y no publica. Publica el commit exacto lanzado, solo si pasan
# en este mismo trabajo las puertas de la CI, e2e incluidas.

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Comprobar la clave de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Falta la clave de Cloudflare::Añade el secreto CLOUDFLARE_API_TOKEN (token con permiso «Cloudflare Pages: Edit») en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Puertas de calidad (las mismas que la CI)
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
      # Las e2e (escritorio, móvil 393 px, nocturno con axe, hojas en una cara) también son
      # requisito para publicar: si fallan, no se despliega.
      - name: Instala el navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e (Playwright)
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Presupuesto de tamaño
        run: npm run presupuesto
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 48acd6a4debc742bccd81b84be547379
          wranglerVersion: "4.86.0"
          command: pages deploy dist --project-name=manual-seen-aid --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
