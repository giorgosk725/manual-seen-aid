name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (contenido, pantallas, accesibilidad)
        run: npm test
      - name: Build (incluye PWA)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instala el navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e (Playwright, escritorio + móvil 393 px + nocturno)
        run: npm run test:e2e
      - name: Informe de Playwright (si falla)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
