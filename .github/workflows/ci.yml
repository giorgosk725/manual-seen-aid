name: CI

# Las actions van fijadas por SHA (con su versión al lado): una etiqueta movida no cambia
# lo que se ejecuta.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (contenido, pantallas, accesibilidad)
        run: npm test
      - name: Build (incluye PWA)
        run: npm run build
      - name: Presupuesto de tamaño (entrada, trozos y precache)
        run: npm run presupuesto

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instala el navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e (Playwright, escritorio + móvil 393 px + nocturno)
        run: npm run test:e2e
      - name: Informe de Playwright (si falla)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
