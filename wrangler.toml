# Cloudflare Pages: la web estática (dist) y la función /api/pasajes (functions/), que usa el
# modelo de significado de Workers AI para la búsqueda por el sentido.
name = "manual-seen-aid"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

[ai]
binding = "AI"

# Consultas sin respuesta (functions/api/sin-respuesta.ts): texto y cuenta, nada de quién.
[[kv_namespaces]]
binding = "CONSULTAS"
id = "b586bf4611f34e649f139c1115867cf9"
